<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="system-ui, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38e1ff"/><stop offset="1" stop-color="#8b7bff"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5ac8ff"/>
    </marker>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="rgba(140,160,255,0.06)"/>
    </pattern>
  </defs>
  <rect width="560" height="340" fill="#070a18"/>
  <rect width="560" height="340" fill="url(#grid)"/>

  <text x="24" y="34" font-size="13" font-weight="600" letter-spacing="3" fill="#8fa0d8">TICKET TRIAGE · BERT</text>
  <rect x="24" y="44" width="46" height="2" fill="url(#acc)"/>
  <rect x="414" y="16" width="124" height="22" rx="11" fill="rgba(56,190,255,0.08)" stroke="rgba(90,200,255,0.3)"/>
  <text x="476" y="31" font-size="11" font-family="Consolas, monospace" fill="#9fd8f2" text-anchor="middle">10K+ queries</text>

  <!-- ticket -->
  <rect x="30" y="92" width="142" height="112" rx="10" fill="rgba(148,163,255,0.06)" stroke="rgba(150,180,255,0.35)"/>
  <text x="42" y="114" font-size="10.5" font-family="Consolas, monospace" fill="#dfe6ff" font-weight="600">#8213</text>
  <text x="42" y="130" font-size="9.5" fill="#aeb9e6">"VPN drops every hour,</text>
  <text x="42" y="144" font-size="9.5" fill="#aeb9e6">can't reach staging…"</text>
  <rect x="42" y="156" width="118" height="6" rx="3" fill="rgba(150,180,255,0.18)"/>
  <rect x="42" y="168" width="94" height="6" rx="3" fill="rgba(150,180,255,0.14)"/>
  <rect x="42" y="180" width="106" height="6" rx="3" fill="rgba(150,180,255,0.10)"/>

  <!-- bert stack -->
  <rect x="222" y="88" width="122" height="24" rx="6" fill="rgba(139,123,255,0.30)" stroke="rgba(139,123,255,0.55)"/>
  <rect x="222" y="120" width="122" height="24" rx="6" fill="rgba(139,123,255,0.20)" stroke="rgba(139,123,255,0.45)"/>
  <rect x="222" y="152" width="122" height="24" rx="6" fill="rgba(139,123,255,0.12)" stroke="rgba(139,123,255,0.35)"/>
  <text x="283" y="104.5" font-size="9.5" font-family="Consolas, monospace" fill="#e6e1ff" text-anchor="middle">attention ×12</text>
  <text x="283" y="136.5" font-size="9.5" font-family="Consolas, monospace" fill="#d5cdfa" text-anchor="middle">transformer</text>
  <text x="283" y="168.5" font-size="9.5" font-family="Consolas, monospace" fill="#c2b8f5" text-anchor="middle">embeddings</text>
  <text x="283" y="196" font-size="10.5" fill="#a99df2" text-anchor="middle" font-weight="600">BERT encoder</text>

  <g stroke="#46c8ff" stroke-width="1.6" stroke-dasharray="6 6" fill="none">
    <line x1="172" y1="148" x2="218" y2="132" marker-end="url(#arr)"><animate attributeName="stroke-dashoffset" values="24;0" dur="1.2s" repeatCount="indefinite"/></line>
    <line x1="344" y1="132" x2="392" y2="132" marker-end="url(#arr)"><animate attributeName="stroke-dashoffset" values="24;0" dur="1.2s" repeatCount="indefinite"/></line>
  </g>

  <!-- class buckets -->
  <g font-size="10">
    <rect x="396" y="80" width="140" height="26" rx="7" fill="rgba(56,190,255,0.10)" stroke="rgba(90,200,255,0.45)"/>
    <text x="406" y="97" fill="#cfeaff" font-weight="600">IT Support</text>
    <text x="528" y="97" fill="#9fd8f2" text-anchor="end" font-family="Consolas, monospace">62%</text>

    <rect x="396" y="114" width="140" height="26" rx="7" fill="rgba(148,163,255,0.06)" stroke="rgba(150,180,255,0.3)"/>
    <text x="406" y="131" fill="#aeb9e6">DevOps</text>
    <text x="528" y="131" fill="#8fa0d8" text-anchor="end" font-family="Consolas, monospace">21%</text>

    <rect x="396" y="148" width="140" height="26" rx="7" fill="rgba(148,163,255,0.06)" stroke="rgba(150,180,255,0.3)"/>
    <text x="406" y="165" fill="#aeb9e6">Engineering</text>
    <text x="528" y="165" fill="#8fa0d8" text-anchor="end" font-family="Consolas, monospace">11%</text>

    <rect x="396" y="182" width="140" height="26" rx="7" fill="rgba(148,163,255,0.06)" stroke="rgba(150,180,255,0.3)"/>
    <text x="406" y="199" fill="#aeb9e6">QA</text>
    <text x="528" y="199" fill="#8fa0d8" text-anchor="end" font-family="Consolas, monospace">6%</text>
  </g>

  <!-- accuracy donut -->
  <circle cx="283" cy="258" r="26" fill="none" stroke="#1c2342" stroke-width="7"/>
  <circle cx="283" cy="258" r="26" fill="none" stroke="#5ff2c0" stroke-width="7" stroke-linecap="round"
    stroke-dasharray="156.9 163.4" transform="rotate(-90 283 258)"/>
  <text x="283" y="263" font-size="12.5" font-family="Consolas, monospace" fill="#b8ffe2" text-anchor="middle" font-weight="700">96%</text>
  <text x="330" y="262" font-size="10" fill="#8fa0d8">accuracy on held-out set</text>
</svg>

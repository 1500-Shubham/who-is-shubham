<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="system-ui, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38e1ff"/><stop offset="1" stop-color="#8b7bff"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5ac8ff"/>
    </marker>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="rgba(140,160,255,0.06)"/>
    </pattern>
  </defs>
  <rect width="560" height="340" fill="#070a18"/>
  <rect width="560" height="340" fill="url(#grid)"/>

  <text x="24" y="34" font-size="13" font-weight="600" letter-spacing="3" fill="#8fa0d8">BOOKING NOTIFICATIONS</text>
  <rect x="24" y="44" width="46" height="2" fill="url(#acc)"/>
  <rect x="376" y="16" width="162" height="22" rx="11" fill="rgba(95,242,192,0.08)" stroke="rgba(95,242,192,0.3)"/>
  <text x="457" y="31" font-size="11" font-family="Consolas, monospace" fill="#8ff2cd" text-anchor="middle">+50% responsiveness</text>

  <!-- phone -->
  <rect x="36" y="64" width="152" height="244" rx="18" fill="rgba(10,14,32,0.9)" stroke="rgba(150,180,255,0.4)"/>
  <rect x="92" y="72" width="40" height="5" rx="2.5" fill="rgba(150,180,255,0.35)"/>
  <rect x="44" y="84" width="136" height="30" rx="8" fill="rgba(37,211,102,0.14)"/>
  <circle cx="60" cy="99" r="8" fill="rgba(37,211,102,0.35)"/>
  <text x="74" y="103" font-size="9.5" fill="#c9f2d9" font-weight="600">Happay Travel</text>
  <g>
    <rect x="48" y="126" width="126" height="56" rx="9" fill="rgba(37,211,102,0.12)" stroke="rgba(37,211,102,0.35)"/>
    <text x="58" y="144" font-size="9.5" fill="#d9f7e4" font-weight="600">✈ BLR → AMS confirmed</text>
    <text x="58" y="158" font-size="9" fill="#9fd4b4">PNR X4Q2W · seat 14A</text>
    <text x="58" y="172" font-size="9" fill="#9fd4b4">e-ticket attached 📎</text>
    <rect x="48" y="192" width="126" height="42" rx="9" fill="rgba(37,211,102,0.12)" stroke="rgba(37,211,102,0.35)"/>
    <text x="58" y="210" font-size="9.5" fill="#d9f7e4" font-weight="600">🏨 Check-in from 2 PM</text>
    <text x="58" y="224" font-size="9" fill="#9fd4b4">voucher HTL-2214 📎</text>
  </g>
  <rect x="48" y="248" width="94" height="20" rx="10" fill="rgba(148,163,255,0.08)"/>
  <text x="95" y="262" font-size="9" fill="#8fa0d8" text-anchor="middle">also via SMS · email</text>

  <!-- flow -->
  <rect x="252" y="86" width="128" height="44" rx="10" fill="rgba(148,163,255,0.07)" stroke="rgba(150,180,255,0.35)"/>
  <text x="316" y="105" font-size="11.5" fill="#dfe6ff" text-anchor="middle" font-weight="600">booking event</text>
  <text x="316" y="120" font-size="9.5" fill="#8fa0d8" text-anchor="middle">flight · hotel systems</text>

  <rect x="252" y="160" width="128" height="44" rx="10" fill="rgba(139,123,255,0.10)" stroke="rgba(139,123,255,0.5)"/>
  <text x="316" y="179" font-size="11.5" fill="#e6e1ff" text-anchor="middle" font-weight="600">Kafka</text>
  <text x="316" y="194" font-size="9.5" fill="#a99df2" text-anchor="middle">notification topics</text>

  <g fill="rgba(148,163,255,0.07)" stroke="rgba(150,180,255,0.35)">
    <rect x="430" y="92" width="106" height="36" rx="9" stroke="rgba(37,211,102,0.55)" fill="rgba(37,211,102,0.08)"/>
    <rect x="430" y="158" width="106" height="36" rx="9"/>
    <rect x="430" y="224" width="106" height="36" rx="9"/>
  </g>
  <g font-size="10.5" text-anchor="middle" font-weight="600">
    <text x="483" y="114" fill="#c9f2d9">WhatsApp</text>
    <text x="483" y="180" fill="#dfe6ff">SMS</text>
    <text x="483" y="246" fill="#dfe6ff">Email</text>
  </g>
  <text x="483" y="140" font-size="8.5" font-family="Consolas, monospace" fill="#8fa0d8" text-anchor="middle">via Yellow.ai</text>

  <g stroke="#46c8ff" stroke-width="1.5" stroke-dasharray="6 6" fill="none">
    <line x1="316" y1="130" x2="316" y2="158" marker-end="url(#arr)"><animate attributeName="stroke-dashoffset" values="24;0" dur="1.2s" repeatCount="indefinite"/></line>
    <path d="M380 172 C 404 160 406 128 428 114" marker-end="url(#arr)"><animate attributeName="stroke-dashoffset" values="24;0" dur="1.2s" repeatCount="indefinite"/></path>
    <line x1="380" y1="180" x2="428" y2="177" marker-end="url(#arr)"><animate attributeName="stroke-dashoffset" values="24;0" dur="1.2s" repeatCount="indefinite"/></line>
    <path d="M380 192 C 404 204 406 228 428 240" marker-end="url(#arr)"><animate attributeName="stroke-dashoffset" values="24;0" dur="1.2s" repeatCount="indefinite"/></path>
  </g>
  <path d="M192 150 C 220 140 224 118 250 110" stroke="#46c8ff" stroke-width="1.5" stroke-dasharray="6 6" fill="none" marker-start="url(#arr)">
    <animate attributeName="stroke-dashoffset" values="0;24" dur="1.2s" repeatCount="indefinite"/>
  </path>

  <text x="536" y="316" font-size="9.5" fill="#6b7398" text-anchor="end">webhooks · templates · delivery receipts</text>
</svg>

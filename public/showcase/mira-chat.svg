<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="system-ui, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38e1ff"/><stop offset="1" stop-color="#8b7bff"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="rgba(140,160,255,0.06)"/>
    </pattern>
  </defs>
  <rect width="560" height="340" fill="#070a18"/>
  <rect width="560" height="340" fill="url(#grid)"/>

  <!-- app window -->
  <rect x="20" y="20" width="520" height="300" rx="14" fill="rgba(10,14,32,0.9)" stroke="rgba(150,180,255,0.32)"/>
  <circle cx="40" cy="40" r="4" fill="#ff6a6a"/><circle cx="54" cy="40" r="4" fill="#ffc46b"/><circle cx="68" cy="40" r="4" fill="#5ff2c0"/>
  <rect x="86" y="32" width="150" height="16" rx="8" fill="rgba(148,163,255,0.08)"/>
  <text x="161" y="43.5" font-size="9.5" font-family="Consolas, monospace" fill="#8fa0d8" text-anchor="middle">mira · trip planner</text>
  <line x1="20" y1="56" x2="540" y2="56" stroke="rgba(150,180,255,0.18)"/>

  <!-- sidebar -->
  <line x1="150" y1="56" x2="150" y2="320" stroke="rgba(150,180,255,0.16)"/>
  <text x="34" y="78" font-size="9" letter-spacing="2" fill="#8fa0d8">THREADS</text>
  <rect x="30" y="88" width="110" height="30" rx="8" fill="rgba(139,123,255,0.16)" stroke="rgba(139,123,255,0.4)"/>
  <text x="40" y="107" font-size="9.5" fill="#e6e1ff" font-weight="600">Goa · 5 days</text>
  <rect x="30" y="124" width="110" height="30" rx="8" fill="rgba(148,163,255,0.05)"/>
  <text x="40" y="143" font-size="9.5" fill="#8fa0d8">Kashmir · 8 days</text>
  <rect x="30" y="160" width="110" height="30" rx="8" fill="rgba(148,163,255,0.05)"/>
  <text x="40" y="179" font-size="9.5" fill="#8fa0d8">Andaman · weekend</text>
  <rect x="30" y="286" width="110" height="22" rx="11" fill="rgba(56,190,255,0.08)" stroke="rgba(90,200,255,0.3)"/>
  <text x="85" y="301" font-size="9" font-family="Consolas, monospace" fill="#9fd8f2" text-anchor="middle">+ new trip</text>

  <!-- chat -->
  <rect x="268" y="70" width="252" height="34" rx="10" fill="rgba(139,123,255,0.18)" stroke="rgba(139,123,255,0.35)"/>
  <text x="394" y="91" font-size="10" fill="#e6e1ff" text-anchor="middle">5 days in Goa, ₹60k budget, beaches + seafood</text>

  <rect x="166" y="116" width="270" height="92" rx="10" fill="rgba(56,190,255,0.08)" stroke="rgba(90,200,255,0.3)"/>
  <circle cx="184" cy="134" r="8" fill="url(#acc)"/>
  <text x="198" y="138" font-size="10" fill="#cfeaff" font-weight="600">MIRA</text>
  <text x="178" y="158" font-size="9.5" fill="#cfeaff">Found 3 flight options and 4 stays inside budget.</text>
  <text x="178" y="173" font-size="9.5" fill="#cfeaff">Day 1: Baga beach sunset → shack dinner…</text>
  <text x="178" y="188" font-size="9.5" fill="#9fd8f2">streaming itinerary</text>
  <circle cx="266" cy="185" r="2.5" fill="#38e1ff"><animate attributeName="opacity" values="0.2;1;0.2" dur="0.9s" repeatCount="indefinite"/></circle>
  <circle cx="276" cy="185" r="2.5" fill="#38e1ff"><animate attributeName="opacity" values="0.2;1;0.2" dur="0.9s" begin="0.3s" repeatCount="indefinite"/></circle>
  <circle cx="286" cy="185" r="2.5" fill="#38e1ff"><animate attributeName="opacity" values="0.2;1;0.2" dur="0.9s" begin="0.6s" repeatCount="indefinite"/></circle>

  <!-- HITL gate -->
  <rect x="166" y="220" width="354" height="42" rx="10" fill="rgba(255,196,107,0.08)" stroke="rgba(255,196,107,0.45)"/>
  <text x="180" y="238" font-size="10" fill="#ffd9a3" font-weight="600">⏸ Human-in-the-loop gate</text>
  <text x="180" y="253" font-size="9" fill="#d8b489">approve the itinerary before the guide is generated</text>
  <rect x="404" y="230" width="60" height="22" rx="11" fill="rgba(95,242,192,0.14)" stroke="rgba(95,242,192,0.5)"/>
  <text x="434" y="245" font-size="9.5" font-family="Consolas, monospace" fill="#b8ffe2" text-anchor="middle">approve</text>
  <rect x="472" y="230" width="40" height="22" rx="11" fill="rgba(148,163,255,0.08)" stroke="rgba(150,180,255,0.3)"/>
  <text x="492" y="245" font-size="9.5" font-family="Consolas, monospace" fill="#aeb9e6" text-anchor="middle">edit</text>

  <!-- composer -->
  <rect x="166" y="276" width="300" height="30" rx="15" fill="rgba(148,163,255,0.06)" stroke="rgba(150,180,255,0.25)"/>
  <text x="180" y="295" font-size="9.5" fill="#6b7398">Message MIRA…</text>
  <rect x="474" y="276" width="46" height="30" rx="15" fill="url(#acc)"/>
  <text x="497" y="295" font-size="10" fill="#071022" text-anchor="middle" font-weight="700">send</text>
</svg>

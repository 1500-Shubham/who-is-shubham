<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="system-ui, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38e1ff"/><stop offset="1" stop-color="#8b7bff"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="rgba(140,160,255,0.06)"/>
    </pattern>
  </defs>
  <rect width="560" height="340" fill="#070a18"/>
  <rect width="560" height="340" fill="url(#grid)"/>

  <text x="24" y="34" font-size="13" font-weight="600" letter-spacing="3" fill="#8fa0d8">CENTRAL OBSERVABILITY</text>
  <rect x="24" y="44" width="46" height="2" fill="url(#acc)"/>
  <rect x="386" y="16" width="152" height="22" rx="11" fill="rgba(56,190,255,0.08)" stroke="rgba(90,200,255,0.3)"/>
  <text x="462" y="31" font-size="11" font-family="Consolas, monospace" fill="#9fd8f2" text-anchor="middle">20+ environments</text>

  <!-- dashboard window -->
  <rect x="24" y="58" width="512" height="252" rx="12" fill="rgba(10,14,32,0.85)" stroke="rgba(150,180,255,0.3)"/>
  <circle cx="44" cy="76" r="4" fill="#ff6a6a"/><circle cx="58" cy="76" r="4" fill="#ffc46b"/><circle cx="72" cy="76" r="4" fill="#5ff2c0"/>
  <rect x="88" y="68" width="180" height="16" rx="8" fill="rgba(148,163,255,0.08)"/>
  <text x="178" y="79.5" font-size="9.5" font-family="Consolas, monospace" fill="#8fa0d8" text-anchor="middle">signoz · otel-collector · prod</text>
  <line x1="24" y1="92" x2="536" y2="92" stroke="rgba(150,180,255,0.18)"/>

  <!-- trace waterfall -->
  <text x="44" y="112" font-size="10" fill="#8fa0d8" letter-spacing="1.5">TRACE · loan-sanction 812ms</text>
  <g rx="4">
    <rect x="44" y="122" width="230" height="9" rx="4.5" fill="#46c8ff" opacity="0.85"/>
    <rect x="62" y="137" width="150" height="9" rx="4.5" fill="#8b7bff" opacity="0.8"/>
    <rect x="80" y="152" width="90" height="9" rx="4.5" fill="#46c8ff" opacity="0.6"/>
    <rect x="150" y="167" width="118" height="9" rx="4.5" fill="#8b7bff" opacity="0.6"/>
    <rect x="176" y="182" width="66" height="9" rx="4.5" fill="#ff6ac2" opacity="0.7"/>
    <rect x="196" y="197" width="80" height="9" rx="4.5" fill="#46c8ff" opacity="0.45"/>
  </g>
  <g font-size="8.5" font-family="Consolas, monospace" fill="#6b7398">
    <text x="280" y="130">gateway</text>
    <text x="218" y="145">workflow-svc</text>
    <text x="176" y="160">rules</text>
    <text x="274" y="175">kyc-ai</text>
    <text x="248" y="190">db</text>
    <text x="282" y="205">notify</text>
  </g>

  <line x1="304" y1="100" x2="304" y2="302" stroke="rgba(150,180,255,0.14)"/>

  <!-- latency chart -->
  <text x="322" y="112" font-size="10" fill="#8fa0d8" letter-spacing="1.5">p95 LATENCY</text>
  <text x="518" y="112" font-size="10.5" font-family="Consolas, monospace" fill="#5ff2c0" text-anchor="end">142ms ▼</text>
  <polyline points="322,168 348,158 374,163 400,146 426,152 452,136 478,140 504,128 518,131"
    fill="none" stroke="url(#acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="322" y1="176" x2="518" y2="176" stroke="rgba(150,180,255,0.2)"/>
  <circle cx="518" cy="131" r="3.5" fill="#5ff2c0">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- logs + alert -->
  <text x="322" y="204" font-size="10" fill="#8fa0d8" letter-spacing="1.5">LOGS · aggregated</text>
  <g font-size="9" font-family="Consolas, monospace">
    <text x="322" y="222" fill="#6f7ba3">12:01:14 INFO  pipeline done env=qa-3</text>
    <text x="322" y="237" fill="#6f7ba3">12:01:15 INFO  span flushed 2.1k</text>
    <text x="322" y="252" fill="#ffb86b">12:01:18 WARN  redis p99 spike</text>
  </g>
  <rect x="322" y="264" width="150" height="24" rx="12" fill="rgba(255,196,107,0.09)" stroke="rgba(255,196,107,0.4)"/>
  <text x="397" y="280" font-size="10.5" font-family="Consolas, monospace" fill="#ffd9a3" text-anchor="middle">⚠ alert → on-call</text>

  <text x="300" y="330" font-size="9.5" fill="#6b7398" text-anchor="middle">traces · logs · infra metrics · proactive alerting — Dev / QA / Sandbox / Prod</text>
</svg>

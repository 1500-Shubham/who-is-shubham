<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="system-ui, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38e1ff"/><stop offset="1" stop-color="#8b7bff"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5ac8ff"/>
    </marker>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="rgba(140,160,255,0.06)"/>
    </pattern>
  </defs>
  <rect width="560" height="340" fill="#070a18"/>
  <rect width="560" height="340" fill="url(#grid)"/>

  <text x="24" y="34" font-size="13" font-weight="600" letter-spacing="3" fill="#8fa0d8">ENTERPRISE SSO · SAML + 2FA</text>
  <rect x="24" y="44" width="46" height="2" fill="url(#acc)"/>
  <rect x="422" y="16" width="116" height="22" rx="11" fill="rgba(56,190,255,0.08)" stroke="rgba(90,200,255,0.3)"/>
  <text x="480" y="31" font-size="11" font-family="Consolas, monospace" fill="#9fd8f2" text-anchor="middle">BKT rollout</text>

  <!-- nodes -->
  <rect x="32" y="118" width="84" height="52" rx="10" fill="rgba(148,163,255,0.07)" stroke="rgba(150,180,255,0.35)"/>
  <circle cx="74" cy="136" r="7" stroke="#7f9bff" fill="none" stroke-width="1.4"/>
  <path d="M62 156 Q74 144 86 156" stroke="#7f9bff" fill="none" stroke-width="1.4"/>
  <text x="74" y="184" font-size="10" fill="#aeb9e6" text-anchor="middle">user</text>

  <rect x="168" y="118" width="132" height="52" rx="10" fill="rgba(148,163,255,0.07)" stroke="rgba(150,180,255,0.35)"/>
  <text x="234" y="140" font-size="12" fill="#dfe6ff" text-anchor="middle" font-weight="600">Assets Connect</text>
  <text x="234" y="156" font-size="9.5" fill="#8fa0d8" text-anchor="middle">auth service</text>

  <rect x="352" y="118" width="110" height="52" rx="10" fill="rgba(77,163,255,0.08)" stroke="rgba(77,163,255,0.5)"/>
  <text x="407" y="140" font-size="12" fill="#bcdcff" text-anchor="middle" font-weight="600">Azure AD</text>
  <text x="407" y="156" font-size="9.5" fill="#7fb2e8" text-anchor="middle">identity provider</text>

  <!-- flows -->
  <g stroke="#46c8ff" stroke-width="1.5" fill="none">
    <line x1="116" y1="144" x2="166" y2="144" marker-end="url(#arr)" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="1.3s" repeatCount="indefinite"/>
    </line>
    <path d="M302 130 C 322 122 330 122 350 128" marker-end="url(#arr)" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="1.3s" repeatCount="indefinite"/>
    </path>
    <path d="M350 160 C 330 168 322 168 302 160" marker-end="url(#arr)" stroke="#8ff2cd" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="1.3s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="326" y="112" font-size="9" font-family="Consolas, monospace" fill="#8fa0d8" text-anchor="middle">SAML request</text>
  <text x="326" y="186" font-size="9" font-family="Consolas, monospace" fill="#8ff2cd" text-anchor="middle">assertion + claims</text>

  <!-- totp phone -->
  <rect x="452" y="196" width="76" height="118" rx="13" fill="rgba(10,14,32,0.9)" stroke="rgba(150,180,255,0.4)"/>
  <rect x="478" y="204" width="24" height="4" rx="2" fill="rgba(150,180,255,0.35)"/>
  <text x="490" y="234" font-size="9" fill="#8fa0d8" text-anchor="middle">TOTP · 2FA</text>
  <text x="490" y="256" font-size="14" font-family="Consolas, monospace" fill="#38e1ff" text-anchor="middle" font-weight="700">482 913</text>
  <circle cx="490" cy="284" r="13" fill="none" stroke="#233058" stroke-width="3"/>
  <circle cx="490" cy="284" r="13" fill="none" stroke="#5ff2c0" stroke-width="3" stroke-linecap="round"
    stroke-dasharray="81.7" stroke-dashoffset="20" transform="rotate(-90 490 284)">
    <animate attributeName="stroke-dashoffset" values="0;81.7" dur="6s" repeatCount="indefinite"/>
  </circle>

  <path d="M268 172 C 300 230 380 244 448 252" stroke="#8b7bff" stroke-width="1.4" fill="none" stroke-dasharray="5 6" marker-end="url(#arr)">
    <animate attributeName="stroke-dashoffset" values="22;0" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <text x="318" y="232" font-size="9" font-family="Consolas, monospace" fill="#a99df2">2FA challenge</text>

  <text x="240" y="292" font-size="9.5" fill="#6b7398">federated login · automated user provisioning across microservices</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="system-ui, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38e1ff"/><stop offset="1" stop-color="#8b7bff"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5ac8ff"/>
    </marker>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="rgba(140,160,255,0.06)"/>
    </pattern>
  </defs>
  <rect width="560" height="340" fill="#070a18"/>
  <rect width="560" height="340" fill="url(#grid)"/>

  <text x="24" y="34" font-size="13" font-weight="600" letter-spacing="3" fill="#8fa0d8">SESSION GATEWAY · GUACAMOLE</text>
  <rect x="24" y="44" width="46" height="2" fill="url(#acc)"/>
  <rect x="386" y="16" width="152" height="22" rx="11" fill="rgba(56,190,255,0.08)" stroke="rgba(90,200,255,0.3)"/>
  <text x="462" y="31" font-size="11" font-family="Consolas, monospace" fill="#9fd8f2" text-anchor="middle">1000+ concurrent</text>

  <!-- users -->
  <g stroke="#7f9bff" stroke-width="1.5" fill="rgba(127,155,255,0.10)">
    <circle cx="64" cy="104" r="9"/><path d="M46 132 Q64 114 82 132"/>
    <circle cx="64" cy="164" r="9"/><path d="M46 192 Q64 174 82 192"/>
    <circle cx="64" cy="224" r="9"/><path d="M46 252 Q64 234 82 252"/>
  </g>
  <text x="64" y="278" font-size="9.5" fill="#8fa0d8" text-anchor="middle">browser clients</text>

  <!-- gateway -->
  <rect x="196" y="128" width="168" height="84" rx="14" fill="rgba(148,163,255,0.07)" stroke="url(#acc)" stroke-width="1.6"/>
  <text x="280" y="158" font-size="13" fill="#eef1ff" text-anchor="middle" font-weight="600">Apache Guacamole</text>
  <text x="280" y="176" font-size="9.5" fill="#8fa0d8" text-anchor="middle">session lifecycle · encryption</text>
  <text x="280" y="190" font-size="9.5" fill="#8fa0d8" text-anchor="middle">archival · retention</text>

  <!-- servers -->
  <g fill="rgba(148,163,255,0.07)" stroke="rgba(150,180,255,0.35)">
    <rect x="420" y="92" width="52" height="30" rx="7"/><rect x="484" y="92" width="52" height="30" rx="7"/>
    <rect x="420" y="138" width="52" height="30" rx="7"/><rect x="484" y="138" width="52" height="30" rx="7"/>
    <rect x="420" y="184" width="52" height="30" rx="7"/><rect x="484" y="184" width="52" height="30" rx="7"/>
    <rect x="420" y="230" width="52" height="30" rx="7"/><rect x="484" y="230" width="52" height="30" rx="7"/>
  </g>
  <g font-size="9.5" font-family="Consolas, monospace" fill="#aeb9e6" text-anchor="middle">
    <text x="446" y="111">SSH</text><text x="510" y="111">RDP</text>
    <text x="446" y="157">RDP</text><text x="510" y="157">SSH</text>
    <text x="446" y="203">SSH</text><text x="510" y="203">SSH</text>
    <text x="446" y="249">RDP</text><text x="510" y="249">RDP</text>
  </g>

  <g stroke="#46c8ff" stroke-width="1.5" stroke-dasharray="6 6" fill="none">
    <path d="M90 110 C 150 118 160 140 194 152" marker-end="url(#arr)"><animate attributeName="stroke-dashoffset" values="24;0" dur="1.3s" repeatCount="indefinite"/></path>
    <path d="M90 168 L 194 170" marker-end="url(#arr)"><animate attributeName="stroke-dashoffset" values="24;0" dur="1.3s" repeatCount="indefinite"/></path>
    <path d="M90 228 C 150 222 160 200 194 188" marker-end="url(#arr)"><animate attributeName="stroke-dashoffset" values="24;0" dur="1.3s" repeatCount="indefinite"/></path>
    <path d="M366 150 C 392 140 396 122 418 110" marker-end="url(#arr)"><animate attributeName="stroke-dashoffset" values="24;0" dur="1.3s" repeatCount="indefinite"/></path>
    <path d="M366 168 L 418 156" marker-end="url(#arr)"><animate attributeName="stroke-dashoffset" values="24;0" dur="1.3s" repeatCount="indefinite"/></path>
    <path d="M366 186 C 392 194 396 190 418 199" marker-end="url(#arr)"><animate attributeName="stroke-dashoffset" values="24;0" dur="1.3s" repeatCount="indefinite"/></path>
    <path d="M366 198 C 396 216 400 232 418 243" marker-end="url(#arr)"><animate attributeName="stroke-dashoffset" values="24;0" dur="1.3s" repeatCount="indefinite"/></path>
  </g>

  <text x="536" y="298" font-size="9.5" fill="#6b7398" text-anchor="end">10K+ sessions · compliance-grade retention</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="system-ui, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38e1ff"/><stop offset="1" stop-color="#8b7bff"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="rgba(140,160,255,0.06)"/>
    </pattern>
  </defs>
  <rect width="560" height="340" fill="#070a18"/>
  <rect width="560" height="340" fill="url(#grid)"/>

  <text x="24" y="34" font-size="13" font-weight="600" letter-spacing="3" fill="#8fa0d8">DB + REDIS FLEET MONITOR</text>
  <rect x="24" y="44" width="46" height="2" fill="url(#acc)"/>
  <rect x="414" y="16" width="124" height="22" rx="11" fill="rgba(56,190,255,0.08)" stroke="rgba(90,200,255,0.3)"/>
  <text x="476" y="31" font-size="11" font-family="Consolas, monospace" fill="#9fd8f2" text-anchor="middle">100+ servers</text>

  <rect x="24" y="58" width="512" height="252" rx="12" fill="rgba(10,14,32,0.85)" stroke="rgba(150,180,255,0.3)"/>
  <circle cx="44" cy="76" r="4" fill="#ff6a6a"/><circle cx="58" cy="76" r="4" fill="#ffc46b"/><circle cx="72" cy="76" r="4" fill="#5ff2c0"/>
  <rect x="88" y="68" width="170" height="16" rx="8" fill="rgba(148,163,255,0.08)"/>
  <text x="173" y="79.5" font-size="9.5" font-family="Consolas, monospace" fill="#8fa0d8" text-anchor="middle">fleet · redis + postgres</text>
  <line x1="24" y1="92" x2="536" y2="92" stroke="rgba(150,180,255,0.18)"/>

  <!-- gauges -->
  <g stroke-width="7" fill="none">
    <circle cx="104" cy="152" r="30" stroke="#1c2342"/>
    <circle cx="104" cy="152" r="30" stroke="#38e1ff" stroke-linecap="round" stroke-dasharray="135.7 188.5" transform="rotate(-90 104 152)"/>
    <circle cx="196" cy="152" r="30" stroke="#1c2342"/>
    <circle cx="196" cy="152" r="30" stroke="#5ff2c0" stroke-linecap="round" stroke-dasharray="177 188.5" transform="rotate(-90 196 152)"/>
    <circle cx="288" cy="152" r="30" stroke="#1c2342"/>
    <circle cx="288" cy="152" r="30" stroke="#8b7bff" stroke-linecap="round" stroke-dasharray="115 188.5" transform="rotate(-90 288 152)"/>
  </g>
  <g font-size="12" font-family="Consolas, monospace" fill="#eef1ff" text-anchor="middle" font-weight="700">
    <text x="104" y="157">72%</text><text x="196" y="157">94%</text><text x="288" y="157">61%</text>
  </g>
  <g font-size="9.5" fill="#8fa0d8" text-anchor="middle">
    <text x="104" y="200">memory</text><text x="196" y="200">hit ratio</text><text x="288" y="200">connections</text>
  </g>

  <!-- latency bars -->
  <text x="344" y="112" font-size="10" fill="#8fa0d8" letter-spacing="1.5">CMD LATENCY / SHARD</text>
  <g>
    <rect x="344" y="156" width="14" height="34" rx="3" fill="#38e1ff" opacity="0.8"/>
    <rect x="368" y="142" width="14" height="48" rx="3" fill="#8b7bff" opacity="0.8"/>
    <rect x="392" y="164" width="14" height="26" rx="3" fill="#38e1ff" opacity="0.6"/>
    <rect x="416" y="132" width="14" height="58" rx="3" fill="#ff6ac2" opacity="0.75"/>
    <rect x="440" y="150" width="14" height="40" rx="3" fill="#8b7bff" opacity="0.6"/>
    <rect x="464" y="158" width="14" height="32" rx="3" fill="#38e1ff" opacity="0.75"/>
    <rect x="488" y="146" width="14" height="44" rx="3" fill="#5ff2c0" opacity="0.7"/>
  </g>
  <line x1="344" y1="190" x2="510" y2="190" stroke="rgba(150,180,255,0.25)"/>

  <!-- recommendations -->
  <line x1="40" y1="216" x2="520" y2="216" stroke="rgba(150,180,255,0.14)"/>
  <text x="40" y="236" font-size="10" fill="#8fa0d8" letter-spacing="1.5">AUTOMATED RECOMMENDATIONS</text>
  <g font-size="10" font-family="Consolas, monospace">
    <text x="40" y="258" fill="#ffd9a3">✦ shard-07: set maxmemory-policy → allkeys-lru</text>
    <text x="40" y="278" fill="#9fd8f2">✦ pg-main: add index txn(user_id, created_at)</text>
    <text x="40" y="298" fill="#8ff2cd">✦ pool: raise max_connections 200 → 280</text>
  </g>
</svg>

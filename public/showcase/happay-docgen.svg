<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="system-ui, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38e1ff"/><stop offset="1" stop-color="#8b7bff"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5ac8ff"/>
    </marker>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="rgba(140,160,255,0.06)"/>
    </pattern>
  </defs>
  <rect width="560" height="340" fill="#070a18"/>
  <rect width="560" height="340" fill="url(#grid)"/>

  <text x="24" y="34" font-size="13" font-weight="600" letter-spacing="3" fill="#8fa0d8">DOCUMENT PIPELINE</text>
  <rect x="24" y="44" width="46" height="2" fill="url(#acc)"/>
  <rect x="418" y="16" width="120" height="22" rx="11" fill="rgba(56,190,255,0.08)" stroke="rgba(90,200,255,0.3)"/>
  <text x="478" y="31" font-size="11" font-family="Consolas, monospace" fill="#9fd8f2" text-anchor="middle">event-driven</text>

  <!-- flow -->
  <rect x="28" y="112" width="100" height="50" rx="10" fill="rgba(148,163,255,0.07)" stroke="rgba(150,180,255,0.35)"/>
  <text x="78" y="133" font-size="11.5" fill="#dfe6ff" text-anchor="middle" font-weight="600">booking svc</text>
  <text x="78" y="149" font-size="9.5" fill="#8fa0d8" text-anchor="middle">emits events</text>

  <rect x="162" y="112" width="92" height="50" rx="10" fill="rgba(139,123,255,0.10)" stroke="rgba(139,123,255,0.5)"/>
  <text x="208" y="133" font-size="11.5" fill="#e6e1ff" text-anchor="middle" font-weight="600">Kafka</text>
  <text x="208" y="149" font-size="9.5" fill="#a99df2" text-anchor="middle">doc.requests</text>

  <rect x="288" y="112" width="112" height="50" rx="10" fill="rgba(148,163,255,0.07)" stroke="url(#acc)" stroke-width="1.5"/>
  <text x="344" y="133" font-size="11.5" fill="#eef1ff" text-anchor="middle" font-weight="600">doc generator</text>
  <text x="344" y="149" font-size="9.5" fill="#8fa0d8" text-anchor="middle">templates + render</text>

  <rect x="440" y="76" width="96" height="44" rx="10" fill="rgba(255,196,107,0.08)" stroke="rgba(255,196,107,0.45)"/>
  <text x="488" y="95" font-size="11.5" fill="#ffe3b8" text-anchor="middle" font-weight="600">AWS S3</text>
  <text x="488" y="110" font-size="9.5" fill="#d8b489" text-anchor="middle">signed URLs</text>

  <rect x="440" y="156" width="96" height="44" rx="10" fill="rgba(148,163,255,0.07)" stroke="rgba(150,180,255,0.35)"/>
  <text x="488" y="175" font-size="11.5" fill="#dfe6ff" text-anchor="middle" font-weight="600">partners</text>
  <text x="488" y="190" font-size="9.5" fill="#8fa0d8" text-anchor="middle">Yellow.ai + more</text>

  <g stroke="#46c8ff" stroke-width="1.6" stroke-dasharray="6 6" fill="none">
    <line x1="128" y1="137" x2="160" y2="137" marker-end="url(#arr)"><animate attributeName="stroke-dashoffset" values="24;0" dur="1.2s" repeatCount="indefinite"/></line>
    <line x1="254" y1="137" x2="286" y2="137" marker-end="url(#arr)"><animate attributeName="stroke-dashoffset" values="24;0" dur="1.2s" repeatCount="indefinite"/></line>
    <path d="M400 126 C 418 118 420 108 438 100" marker-end="url(#arr)"><animate attributeName="stroke-dashoffset" values="24;0" dur="1.2s" repeatCount="indefinite"/></path>
    <path d="M400 148 C 418 156 420 166 438 174" marker-end="url(#arr)"><animate attributeName="stroke-dashoffset" values="24;0" dur="1.2s" repeatCount="indefinite"/></path>
  </g>

  <!-- generated docs -->
  <g>
    <g transform="translate(232 216)">
      <rect width="38" height="50" rx="4" fill="rgba(148,163,255,0.08)" stroke="rgba(150,180,255,0.4)"/>
      <path d="M26 0 L38 12 L26 12 Z" fill="rgba(150,180,255,0.25)"/>
      <text x="19" y="32" font-size="9" font-family="Consolas, monospace" fill="#9fd8f2" text-anchor="middle">PDF</text>
    </g>
    <g transform="translate(288 216)">
      <rect width="38" height="50" rx="4" fill="rgba(148,163,255,0.08)" stroke="rgba(150,180,255,0.4)"/>
      <path d="M26 0 L38 12 L26 12 Z" fill="rgba(150,180,255,0.25)"/>
      <text x="19" y="32" font-size="9" font-family="Consolas, monospace" fill="#9fd8f2" text-anchor="middle">PDF</text>
    </g>
    <g transform="translate(344 216)">
      <rect width="38" height="50" rx="4" fill="rgba(148,163,255,0.08)" stroke="rgba(150,180,255,0.4)"/>
      <path d="M26 0 L38 12 L26 12 Z" fill="rgba(150,180,255,0.25)"/>
      <text x="19" y="32" font-size="9" font-family="Consolas, monospace" fill="#9fd8f2" text-anchor="middle">PDF</text>
    </g>
  </g>
  <text x="307" y="292" font-size="9.5" fill="#6b7398" text-anchor="middle">tickets · vouchers · invoices — generated + delivered automatically</text>
</svg>
